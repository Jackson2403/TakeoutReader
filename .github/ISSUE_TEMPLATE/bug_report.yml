name: Bug report
description: Report something that's broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run dev`
        2. Drop a `.zip` into the dashboard
        3. See ... 
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & version
      description: e.g. Chrome 120, Firefox 121
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect, and what actually happened?
    validations:
      required: false
