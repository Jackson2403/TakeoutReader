name: Feature request
description: Suggest an idea or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What would this add or improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch of how it might work (rough is fine)
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parser / new data source
        - Visualization
        - Search / Timeline
        - Performance
        - Other
    validations:
      required: false
